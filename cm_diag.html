<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CM Diag</title>
<style>body{background:#0d0f1a;color:#e2e8f0;font-family:monospace;padding:20px;font-size:13px;line-height:1.6}</style>
</head>
<body>
<pre id="log">Diagnóstico de CodeMirror...
</pre>
<script>
const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; };
(async () => {
    const t0 = performance.now();
    try {
        log('1) Iniciando Promise.all de 6 imports...');
        const cm = await Promise.all([
            import('https://esm.sh/codemirror@6').then(m => (log('  ✓ codemirror'), m)),
            import('https://esm.sh/@codemirror/view@6').then(m => (log('  ✓ view'), m)),
            import('https://esm.sh/@codemirror/state@6').then(m => (log('  ✓ state'), m)),
            import('https://esm.sh/@codemirror/commands@6').then(m => (log('  ✓ commands'), m)),
            import('https://esm.sh/@codemirror/language@6').then(m => (log('  ✓ language'), m)),
            import('https://esm.sh/@lezer/highlight@1').then(m => (log('  ✓ highlight'), m)),
        ]);
        log(`2) Todo cargado en ${(performance.now()-t0).toFixed(0)} ms`);
        const [mainMod, viewMod, stateMod, cmdMod, langMod, hlMod] = cm;
        log('3) Exports:');
        log('   codemirror: ' + Object.keys(mainMod).slice(0, 10).join(', '));
        log('   @codemirror/view: ' + Object.keys(viewMod).slice(0, 10).join(', '));
        log('   @codemirror/state: ' + Object.keys(stateMod).slice(0, 10).join(', '));
        log('   @codemirror/commands: ' + Object.keys(cmdMod).slice(0, 10).join(', '));
        log('   @codemirror/language: ' + Object.keys(langMod).slice(0, 10).join(', '));
        log('   @lezer/highlight: ' + Object.keys(hlMod).slice(0, 10).join(', '));
        log('4) ¿basicSetup?  ' + typeof mainMod.basicSetup);
        log('   ¿EditorView?  ' + typeof mainMod.EditorView);
        log('   ¿keymap?      ' + typeof viewMod.keymap);
        log('   ¿EditorState? ' + typeof stateMod.EditorState);
        log('   ¿Compartment? ' + typeof stateMod.Compartment);
        log('   ¿indentWithTab? ' + typeof cmdMod.indentWithTab);
        log('   ¿StreamLanguage? ' + typeof langMod.StreamLanguage);
        log('   ¿HighlightStyle? ' + typeof langMod.HighlightStyle);
        log('   ¿syntaxHighlighting? ' + typeof langMod.syntaxHighlighting);
        log('   ¿indentUnit?  ' + typeof langMod.indentUnit);
        log('   ¿tags?        ' + typeof hlMod.tags);
    } catch (e) {
        log('✗ ERROR: ' + e.message + '\n' + e.stack);
    }
})();
</script>
</body></html>
